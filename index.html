<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt</title>

<style>
body{
    margin:0;
    padding:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    font-family:Arial,sans-serif;
}

.contact-bar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:20px;
    font-size:clamp(1.2rem,2vw,2rem);
    color:orange;
    text-align:center;
    padding:20px;
    max-width:600px;
}

.contact-bar span{
    font-weight:bold;
}

.contact-bar a{
    display:flex;
    align-items:center;
    text-decoration:none;
}

.contact-bar img{
    width:clamp(2rem,4vw,2.5rem);
    height:clamp(2rem,4vw,2.5rem);
    transition:transform .3s ease, filter .3s ease;
}

.contact-bar a:hover img{
    transform:scale(1.2);
    filter:brightness(1.5) drop-shadow(0 0 5px orange);
}

@media (max-width:600px){
    .contact-bar{
        gap:15px;
        font-size:1rem;
    }
}
</style>
</head>

<body>

<div class="contact-bar">

    <span>Kontakt:</span>

    <a href="https://wa.me/4917638265657" target="_blank" aria-label="WhatsApp">
        <img src="https://cdn-icons-png.flaticon.com/512/15707/15707820.png" alt="WhatsApp">
    </a>

    <a href="tel:+4917638265657" title="Jetzt anrufen" aria-label="Telefon">
        <img src="https://cdn-icons-png.flaticon.com/512/8770/8770958.png" alt="Telefon">
    </a>

    <a href="mailto:Sunnysschaetze-Kontakt@hotmail.com" aria-label="E-Mail">
        <img src="https://cdn-icons-png.flaticon.com/512/732/732200.png" alt="Mail">
    </a>

</div>

</body>
</html>
